name = "repaso-tc1037"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Modelo de Claude. Haiku 5.5 es el más barato; si lee mal la letra, cambia a "claude-opus-5-5".
MODELO = "claude-haiku-5-5"
# Dirección de tu GitHub Pages (sin la ruta del repositorio y sin diagonal final). Varias se separan con comas.
ORIGENES_PERMITIDOS = "https://TU-USUARIO.github.io"
# Solicitudes permitidas por alumno (navegador) cada 10 minutos.
LIMITE_POR_ALUMNO = "40"

# Secretos (no se escriben aquí):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CODIGO_CLASE
